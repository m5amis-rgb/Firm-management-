.dlist{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}

(function(){

function norm(x){x=x||{};(x.residents||[]).forEach(function(r){if(LMAP[r.level])r.level=LMAP[r.level]});x.firm=x.firm||'My Firm';x.residents=x.residents||[];x.leaves=x.leaves||[];x.updatedAt=x.updatedAt||0;return x}

/* ---------- dates ---------- */
function pad(n){return String(n).padStart(2,'0')}
function iso(y,m,d){return y+'-'+pad(m+1)+'-'+pad(d)}
function toT(s){var p=s.split('-').map(Number);return Date.UTC(p[0],p[1]-1,p[2])}
function fromT(t){var d=new Date(t);return iso(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())}
function addDays(s,n){return fromT(toT(s)+n*864e5)}
function addMonths(s,n){var p=s.split('-').map(Number);return fromT(Date.UTC(p[0],p[1]-1+n,p[2])-864e5)}
function span(a,b){return Math.round((toT(b)-toT(a))/864e5)+1}
function ov(a1,b1,a2,b2){var s=Math.max(toT(a1),toT(a2)),e=Math.min(toT(b1),toT(b2));return e<s?0:Math.round((e-s)/864e5)+1}
function dow(s){return new Date(toT(s)).getUTCDay()}
function today(){var d=new Date();return iso(d.getFullYear(),d.getMonth(),d.getDate())}
function mRange(y,m){return [iso(y,m,1),iso(y,m,new Date(Date.UTC(y,m+1,0)).getUTCDate())]}
function fmt(s){var d=new Date(toT(s));return d.getUTCDate()+' '+MON[d.getUTCMonth()]+' '+String(d.getUTCFullYear()).slice(2)}
function fmtR(a,b){return a===b?fmt(a):fmt(a)+' → '+fmt(b)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function res(id){for(var i=0;i<S.residents.length;i++)if(S.residents[i].id===id)return S.residents[i]}
function lv(id){for(var i=0;i<S.leaves.length;i++)if(S.leaves[i].id===id)return S.leaves[i]}
function byStart(a,b){return a.start<b.start?-1:a.start>b.start?1:a.name.localeCompare(b.name)}

function stats(r,a,b){
  var o={days:ov(r.start,r.end,a,b),S:0,A:0,E:0,O:0,T:0};
  S.leaves.forEach(function(l){if(l.rid!==r.id)return;var d=ov(l.start,l.end,a,b);o[l.type]+=d;o.T+=d});
  return o;
}
function leaveMap(rid,a,b){
  var m={};
  S.leaves.forEach(function(l){if(l.rid!==rid||!ov(l.start,l.end,a,b))return;
    var d=l.start<a?a:l.start,e=l.end>b?b:l.end;while(d<=e){m[d]=l;d=addDays(d,1)}});
  return m;
}

function doPublish(){
  if(sheetOpen){schedule(800);return}
  art.publish(buildDoc()).then(function(){status='saved';renderStatus()}).catch(function(e){
    var c=String((e&&(e.code||e.name))||'')+' '+String((e&&e.message)||e||'');
    if(/not_granted|not_writer/.test(c)){readOnly=true;status='readonly'}
    else if(/conflict/.test(c)){status='saved'}
    else status='error';
    renderStatus();
  });
}
function statusHTML(){
  var t={saved:'Saved',saving:'Saving…',error:'Not saved — try again',readonly:'View only',local:'Saved on this device'}[status];
  return '<div class="status '+status+'" id="st"><i></i>'+t+'</div>';
}
function renderStatus(){var el=document.getElementById('st');if(el)el.outerHTML=statusHTML()}

/* ---------- views ---------- */
function header(){
  return '<header><div class="top"><div><div class="brand">Firm Rota &amp; Leave</div><button class="firm" data-act="firm">'+esc(S.firm)+'<span>✎</span></button>'+statusHTML()+'</div>'+
  '<button class="btn primary" data-act="addLeave">+ Leave</button></div>'+
  (ui.v!=='res'?'<div class="monthnav"><button data-act="prev" aria-label="Previous month">‹</button><button class="ml" data-act="thisMonth">'+MONTHS[ui.m]+' '+ui.y+'</button><button data-act="next" aria-label="Next month">›</button></div>':'<div style="height:10px"></div>')+
  '<nav class="tabs">'+[['cal','Calendar'],['sum','Summary'],['res','Residents']].map(function(t){return '<button data-act="tab" data-v="'+t[0]+'" class="'+(ui.v===t[0]?'on':'')+'">'+t[1]+'</button>'}).join('')+'</nav></header>';
}
var AV=['#0f766e','#4f46e5','#c2410c','#be185d','#0369a1','#7c3aed','#15803d','#b45309','#0e7490','#9f1239'];
function rc(r){var h=0,k=r.id||r.name||'';for(var i=0;i<k.length;i++)h=(h*31+k.charCodeAt(i))>>>0;return AV[h%AV.length]}
function ini(n){var w=String(n||'?').replace(/^dr\.?\s*/i,'').trim().split(/\s+/);return ((w[0]||'?')[0]+(w.length>1?w[w.length-1][0]:'')).toUpperCase()}
function avatar(r,sz){sz=sz||40;return '<span class="av" style="width:'+sz+'px;height:'+sz+'px;font-size:'+Math.round(sz*.38)+'px;background:'+rc(r)+'">'+esc(ini(r.name))+'</span>'}
function lvl(r){return r.level?'<span class="lvl">'+esc(r.level)+'</span>':''}
function empty(t,p,act,btn){return '<div class="empty"><h3>'+t+'</h3><p>'+p+'</p><button class="btn primary" data-act="'+act+'">'+btn+'</button></div>'}
function legend(){return '<div class="legend">'+TK.map(function(k){return '<span><b style="background:'+TYPES[k].color+'"></b>'+k+' = '+TYPES[k].name+'</span>'}).join('')+'<span><b style="background:#eceef1"></b>Not in firm</span></div>'}
function sumTxt(o){var p=[];TK.forEach(function(k){if(o[k])p.push('<i class="'+k.toLowerCase()+'">'+k+' '+o[k]+'</i>')});return p.join(' · ')}

function gridView(){
  if(!S.residents.length)return empty('No residents yet','Add a resident and set their firm assignment dates.','addRes','+ Add resident');
  var r0=mRange(ui.y,ui.m),ms=r0[0],me=r0[1],n=span(ms,me),td=today();
  var rs=S.residents.filter(function(r){return ov(r.start,r.end,ms,me)>0}).sort(byStart);
  if(!rs.length)return empty('Nobody assigned in '+MONTHS[ui.m],'No resident’s assignment covers this month.','addRes','+ Add resident');
  var h='<div class="gridwrap"><table class="grid"><thead><tr><th class="nm">Resident</th>',i,d,w;
  for(i=0;i<n;i++){d=addDays(ms,i);w=dow(d);h+='<th class="'+(w===5||w===6?'we ':'')+(d===td?'td':'')+'"><small>'+WD[w]+'</small>'+(i+1)+'</th>'}
  h+='</tr></thead><tbody>';
  rs.forEach(function(r){
    var map=leaveMap(r.id,ms,me),st=stats(r,ms,me),t=sumTxt(st);
    h+='<tr><th class="nm" style="box-shadow:inset 3px 0 0 '+rc(r)+'" data-act="openRes" data-id="'+r.id+'"><b>'+esc(r.name)+'</b><small>'+esc(r.level||'')+(t?' · '+t:'')+'</small></th>';
    for(i=0;i<n;i++){
      d=addDays(ms,i);w=dow(d);var l=map[d],cls=(w===5||w===6?'we ':'')+(d===td?'td':'');
      if(l)h+='<td class="lv '+(d===td?'td':'')+'" style="background:'+TYPES[l.type].color+'" data-act="editLeave" data-id="'+l.id+'">'+l.type+'</td>';
      else if(d<r.start||d>r.end)h+='<td class="off"></td>';
      else h+='<td class="'+cls+'" data-act="cell" data-r="'+r.id+'" data-d="'+d+'"></td>';
    }
    h+='</tr>';
  });
  return h+'</tbody></table></div><div class="hint">Tap an empty day to add leave · tap a coloured day to edit · tap a name for the resident’s file. Fri–Sat shaded.</div>'+legend();
}


var DOWL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function short(n){n=String(n||'').replace(/^dr\.?\s*/i,'').trim();return n.split(/\s+/)[0]||n}
function onDay(d){return S.residents.filter(function(r){return d>=r.start&&d<=r.end}).sort(byStart)}
function leavesOn(d,rid){return S.leaves.filter(function(l){return d>=l.start&&d<=l.end&&(!rid||l.rid===rid)&&res(l.rid)})}
function calView(){
  if(!S.residents.length)return empty('No residents yet','Add a resident and set their firm assignment dates.','addRes','+ Add resident');
  if(ui.rf&&!res(ui.rf))ui.rf='';
  var bar='<div class="cvbar"><div class="seg">'+[['month','Month'],['days','Days'],['grid','Grid']].map(function(c){return '<button data-act="cv" data-v="'+c[0]+'" class="'+(ui.cv===c[0]?'on':'')+'">'+c[1]+'</button>'}).join('')+'</div>'+
    (ui.cv!=='grid'?'<select id="rf"><option value="">All residents</option>'+S.residents.slice().sort(byStart).map(function(r){return '<option value="'+r.id+'"'+(ui.rf===r.id?' selected':'')+'>'+esc(r.name)+'</option>'}).join('')+'</select>':'')+'</div>';
  return bar+(ui.cv==='month'?monthView():ui.cv==='days'?daysView():gridView());
}
function monthView(){
  var r0=mRange(ui.y,ui.m),ms=r0[0],n=span(ms,r0[1]),td=today(),first=dow(ms),R=ui.rf?res(ui.rf):null;
  var h='<div class="mgrid">'+WD.map(function(w,i){return '<div class="wh'+(i>=5?' we':'')+'">'+w+'</div>'}).join('');
  for(var b=0;b<first;b++)h+='<div class="mc blank"></div>';
  for(var i=0;i<n;i++){
    var d=addDays(ms,i),w=dow(d),we=(w===5||w===6)?' we':'',tdc=d===td?' td':'';
    if(R){
      var l=leavesOn(d,R.id)[0];
      if(d<R.start||d>R.end)h+='<div class="mc off'+tdc+'"><div class="dn">'+(i+1)+'</div></div>';
      else if(l)h+='<div class="mc full'+tdc+'" style="background:'+TYPES[l.type].color+'" data-act="editLeave" data-id="'+l.id+'"><div class="dn">'+(i+1)+'</div><div class="lbl">'+TYPES[l.type].name+'</div></div>';
      else h+='<div class="mc'+we+tdc+'" data-act="cell" data-r="'+R.id+'" data-d="'+d+'"><div class="dn">'+(i+1)+'</div></div>';
    }else{
      var ls=leavesOn(d),inF=onDay(d).length;
      h+='<div class="mc'+we+tdc+'" data-act="day" data-d="'+d+'"><div class="dn">'+(i+1)+'</div>'+(inF?'<span class="cnt">'+(inF-ls.length)+'/'+inF+'</span>':'');
      ls.slice(0,3).forEach(function(l){h+='<span class="ch" style="background:'+TYPES[l.type].color+'">'+l.type+' '+esc(short(res(l.rid).name))+'</span>'});
      if(ls.length>3)h+='<span class="more">+'+(ls.length-3)+' more</span>';
      h+='</div>';
    }
  }
  var tail=(7-((first+n)%7))%7;for(b=0;b<tail;b++)h+='<div class="mc blank"></div>';
  return h+'</div><div class="hint">'+(R?'Tap a day to add leave for '+esc(R.name)+' · tap a coloured day to edit.':'Tap any day to see who’s in and add leave. Corner number = present / assigned.')+'</div>'+legend();
}
function daysView(){
  var r0=mRange(ui.y,ui.m),ms=r0[0],n=span(ms,r0[1]),td=today(),R=ui.rf?res(ui.rf):null;
  var h='<div class="dlist">';
  for(var i=0;i<n;i++){
    var d=addDays(ms,i),w=dow(d),cls='dl'+((w===5||w===6)?' we':'')+(d===td?' td':''),body='',act;
    if(R){
      var l=leavesOn(d,R.id)[0];
      if(d<R.start||d>R.end){cls+=' off';body='<span class="ok">Not in firm</span>';act=''}
      else if(l){body='<span class="tag" style="background:'+TYPES[l.type].color+'">'+TYPES[l.type].name+' leave</span>'+(l.note?'<span class="ok">'+esc(l.note)+'</span>':'');act='data-act="editLeave" data-id="'+l.id+'"'}
      else{body='<span class="ok">Present</span>';act='data-act="cell" data-r="'+R.id+'" data-d="'+d+'"'}
    }else{
      var ls=leavesOn(d),inF=onDay(d).length;act='data-act="day" data-d="'+d+'"';
      if(!inF)body='<span class="ok">No residents assigned</span>';
      else{
        ls.forEach(function(l){body+='<span class="tag" style="background:'+TYPES[l.type].color+'">'+l.type+' · '+esc(res(l.rid).name)+'</span>'});
        body+='<span class="ok">'+(ls.length?(inF-ls.length)+'/'+inF+' present':'All present ('+inF+')')+'</span>';
      }
    }
    h+='<div class="'+cls+'" '+act+'><div class="dd"><b>'+(i+1)+'</b><small>'+DOWL[w].slice(0,3)+'</small></div><div class="who">'+body+'</div></div>';
  }
  return h+'</div>'+legend();
}
function daySheet(d){
  var rs=onDay(d),dt=new Date(toT(d));
  var h='<h3>'+DOWL[dt.getUTCDay()]+' '+fmt(d)+'</h3>';
  if(!rs.length)h+='<div class="hint">No residents assigned on this day.</div>';
  rs.forEach(function(r){
    var l=leavesOn(d,r.id)[0];
    h+='<div class="pr">'+avatar(r,36)+'<div class="grow"><div class="nmr"><b>'+esc(r.name)+'</b>'+lvl(r)+'</div><div style="font-size:12px;color:var(--mut)">'+(l?fmtR(l.start,l.end):'Present')+'</div></div>'+
      (l?'<button class="btn sm" style="background:'+TYPES[l.type].color+';color:#fff;border-color:transparent" data-act="editLeave" data-id="'+l.id+'">'+TYPES[l.type].name+'</button>':'<button class="btn sm" data-act="cell" data-r="'+r.id+'" data-d="'+d+'">+ Leave</button>')+'</div>';
  });
  openSheet(h+'<div class="actions" style="margin-top:14px"><button class="btn" data-act="close">Close</button></div>');
}

function sumRows(){
  var r0=mRange(ui.y,ui.m),ms=r0[0],me=r0[1];
  var rs=ui.sum==='month'?S.residents.filter(function(r){return ov(r.start,r.end,ms,me)>0}):S.residents.slice();
  return rs.sort(byStart).map(function(r){var a=ui.sum==='month'?ms:r.start,b=ui.sum==='month'?me:r.end;return {r:r,s:stats(r,a,b)}});
}
function sumView(){
  if(!S.residents.length)return empty('No residents yet','Add residents to see their leave summary.','addRes','+ Add resident');
  var rows=sumRows(),r0=mRange(ui.y,ui.m),ms=r0[0],me=r0[1],isM=ui.sum==='month',td=today();
  var h='<div class="rowbar"><div class="seg"><button data-act="sumMode" data-v="month" class="'+(isM?'on':'')+'">This month</button><button data-act="sumMode" data-v="all" class="'+(!isM?'on':'')+'">Whole assignment</button></div><button class="btn sm" data-act="copySum">Copy</button></div>';
  if(!rows.length)return h+empty('Nobody assigned in '+MONTHS[ui.m],'Switch to “Whole assignment” or pick another month.','addRes','+ Add resident');
  var tot={S:0,A:0,E:0,O:0,T:0};rows.forEach(function(x){TK.forEach(function(k){tot[k]+=x.s[k]});tot.T+=x.s.T});
  h+='<div class="sumhead">'+(isM?MONTHS[ui.m]+' '+ui.y:'Whole assignment')+' · '+rows.length+' resident'+(rows.length>1?'s':'')+'</div>';
  h+='<div class="ovr"><div class="o1"><b>'+tot.T+'</b>Leave days</div><div class="o2"><b>'+tot.S+'</b>Sick</div><div class="o3"><b>'+tot.A+'</b>Annual</div><div class="o4"><b>'+(tot.E+tot.O)+'</b>Emerg./Other</div></div>';
  rows.forEach(function(x){
    var r=x.r,st=x.s,a=isM?ms:r.start,b=isM?me:r.end,worked=Math.max(0,st.days-st.T);
    var pill=td<r.start?'<span class="pill up">Upcoming</span>':td>r.end?'<span class="pill end">Ended</span>':'<span class="pill act">Active</span>';
    var bar='<div class="bar">';
    if(st.days){bar+='<i style="flex:'+worked+';background:#10b981"></i>';TK.forEach(function(k){if(st[k])bar+='<i style="flex:'+st[k]+';background:'+TYPES[k].color+'"></i>'})}
    bar+='</div>';
    var ls=S.leaves.filter(function(l){return l.rid===r.id&&ov(l.start,l.end,a,b)}).sort(function(p,q){return p.start<q.start?-1:1});
    h+='<div class="card sc" style="border-top:4px solid '+rc(r)+'"><div class="sct" data-act="openRes" data-id="'+r.id+'"><div class="who2">'+avatar(r,46)+'<div><div class="nmr"><b>'+esc(r.name)+'</b>'+lvl(r)+'</div><div class="sub">Assignment · '+fmtR(r.start,r.end)+'</div></div></div>'+pill+'</div>'+
      '<div class="scn"><div><b class="g">'+worked+'</b><small>Days worked</small></div><div><b class="r">'+st.T+'</b><small>Days on leave</small></div><div><b>'+st.days+'</b><small>Days in firm</small></div><div><b>'+(st.days?Math.round(worked/st.days*100):0)+'%</b><small>Attendance</small></div></div>'+bar+
      '<div class="tiles">'+TK.map(function(k){return '<div class="'+(st[k]?'':'z')+'" style="'+(st[k]?'background:'+TYPES[k].color+'14;border-color:'+TYPES[k].color+'55;color:'+TYPES[k].color:'')+'"><b>'+st[k]+'</b>'+TYPES[k].name+'</div>'}).join('')+'</div>'+
      (ls.length?'<div class="sl">'+ls.map(function(l){var dd=ov(l.start,l.end,a,b);return '<div class="li" data-act="editLeave" data-id="'+l.id+'"><span class="chip" style="background:'+TYPES[l.type].color+'">'+l.type+'</span><div class="grow"><div>'+fmtR(l.start,l.end)+'</div><div class="mut">'+TYPES[l.type].name+' leave · '+dd+' day'+(dd>1?'s':'')+(dd!==span(l.start,l.end)?' in this period':'')+(l.note?' · '+esc(l.note):'')+'</div></div><span class="mut">›</span></div>'}).join('')+'</div>':'<div class="none">No leave ✓</div>')+
      '<button class="btn sm addl" data-act="leaveFor" data-id="'+r.id+'">+ Add leave</button></div>';
  });
  return h+'<div class="hint">Calendar days. Tap a name to open the resident, or a leave to edit it.</div>';
}
function leaveLi(l,noName){
  var r=res(l.rid);
  return '<div class="li" data-act="editLeave" data-id="'+l.id+'"><span class="chip" style="background:'+TYPES[l.type].color+'">'+l.type+'</span><div class="grow"><div>'+(noName?TYPES[l.type].name+' leave':'<b>'+esc(r?r.name:'?')+'</b> · '+TYPES[l.type].name)+'</div><div class="mut">'+fmtR(l.start,l.end)+' · '+span(l.start,l.end)+' d'+(l.note?' · '+esc(l.note):'')+'</div></div><span class="mut">›</span></div>';

function resView(){
  if(!S.residents.length)return empty('No residents yet','Start by adding the residents rotating in your firm.','addRes','+ Add resident');
  var td=today(),h='<div class="rowbar"><b>'+S.residents.length+' resident'+(S.residents.length>1?'s':'')+'</b><button class="btn sm primary" data-act="addRes">+ Resident</button></div>';

    var st=stats(r,r.start,r.end),p=td<r.start?'<span class="pill up">Upcoming</span>':td>r.end?'<span class="pill end">Ended</span>':'<span class="pill act">Active</span>',t=sumTxt(st);

var sheet=document.createElement('div');sheet.className='sheet hidden';document.body.appendChild(sheet);
var toastEl=document.createElement('div');toastEl.className='toast';document.body.appendChild(toastEl);
function toast(t){toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(toastEl._t);toastEl._t=setTimeout(function(){toastEl.classList.remove('show')},2000)}
function openSheet(html){sheet.innerHTML='<div class="backdrop" data-act="close"></div><div class="panel">'+html+'</div>';sheet.classList.remove('hidden');sheetOpen=true}
function closeSheet(){sheet.classList.add('hidden');sheet.innerHTML='';sheetOpen=false;F=null}
function $(id){return document.getElementById(id)}
var F=null;

function leaveSheet(o){
  if(!S.residents.length){toast('Add a resident first');resSheet();return}
  var td=today(),L;
  if(o.id)L=Object.assign({},lv(o.id));
  else{
    var rid=o.rid;
    if(!rid){var act=S.residents.filter(function(r){return td>=r.start&&td<=r.end});rid=(act[0]||S.residents.slice().sort(byStart)[0]).id}
    L={id:null,rid:rid,type:'S',start:o.date||td,end:o.date||td,note:''};
  }
  F={kind:'leave',L:L};
  var opts=S.residents.slice().sort(byStart).map(function(r){return '<option value="'+r.id+'"'+(r.id===L.rid?' selected':'')+'>'+esc(r.name)+(r.level?' ('+esc(r.level)+')':'')+'</option>'}).join('');
  openSheet('<h3>'+(L.id?'Edit leave':'Add leave')+'</h3>'+
    '<label>Resident<select id="f-rid">'+opts+'</select></label>'+
    '<div class="types">'+TK.map(function(k){return '<button data-act="ftype" data-t="'+k+'" class="'+(L.type===k?'on':'')+'" style="'+(L.type===k?'background:'+TYPES[k].color:'')+'">'+TYPES[k].name+'</button>'}).join('')+'</div>'+
    '<div class="row2"><label>From<input type="date" id="f-start" value="'+L.start+'"></label><label>To<input type="date" id="f-end" value="'+L.end+'"></label></div>'+
    '<div class="chips">Days: '+[1,2,3,5,7,14].map(function(n){return '<button data-act="fdur" data-n="'+n+'">'+n+'</button>'}).join('')+'</div>'+
    '<div id="f-info" class="info"></div>'+
    '<label>Note (optional)<input id="f-note" value="'+esc(L.note)+'" placeholder="e.g. medical certificate received"></label>'+
    '<div class="actions">'+(L.id?'<button class="btn danger" data-act="delLeave">Delete</button><span class="sp"></span>':'')+'<button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="saveLeave">Save</button></div>');
  updInfo();
}
function readLeave(){var L=F.L;L.rid=$('f-rid').value;L.start=$('f-start').value;L.end=$('f-end').value;L.note=$('f-note').value.trim();return L}
function checkLeave(L){
  if(!L.start||!L.end)return{err:'Choose both dates.'};
  if(L.end<L.start)return{err:'“To” is before “From”.'};
  var clash=S.leaves.filter(function(x){return x.rid===L.rid&&x.id!==L.id&&ov(x.start,x.end,L.start,L.end)})[0];
  if(clash)return{err:'Overlaps existing '+TYPES[clash.type].name+' leave ('+fmtR(clash.start,clash.end)+').'};
  var r=res(L.rid),warn='';
  if(r&&(L.start<r.start||L.end>r.end))warn=' Note: part of this is outside the firm assignment ('+fmtR(r.start,r.end)+').';
  return{ok:span(L.start,L.end),warn:warn};
}
function updInfo(){
  var el=$('f-info');if(!el)return;var c=checkLeave(readLeave());
  if(c.err){el.className='info err';el.textContent=c.err}
  else{el.className='info'+(c.warn?' warn':'');el.textContent=c.ok+' day'+(c.ok>1?'s':'')+' of '+TYPES[F.L.type].name.toLowerCase()+' leave.'+c.warn}
}

function resSheet(id){
  var r0=mRange(ui.y,ui.m),r=id?Object.assign({},res(id)):{id:null,name:'',level:'Junior Resident',start:r0[0],end:r0[1]};
  F={kind:'res',R:r,del:false};
  var h=id?'<div class="who2" style="margin-bottom:14px">'+avatar(r,48)+'<div><div class="nmr"><b style="font-size:18px">'+esc(r.name)+'</b>'+lvl(r)+'</div><div class="sub">Assignment · '+fmtR(r.start,r.end)+'</div></div></div>':'<h3>Add resident</h3>';
  if(id){
    var st=stats(r,r.start,r.end);
    h+='<div class="stats">'+TK.map(function(k){return '<div><b style="color:'+TYPES[k].color+'">'+st[k]+'</b>'+TYPES[k].name+'</div>'}).join('')+'</div>';
    var ls=S.leaves.filter(function(l){return l.rid===id}).sort(function(a,b){return a.start<b.start?1:-1});
    h+='<div class="rowbar" style="margin-bottom:4px"><b style="font-size:14px">Leaves ('+st.T+' d)</b><button class="btn sm primary" data-act="leaveFor" data-id="'+id+'">+ Leave</button></div>';
    h+='<div style="margin-bottom:16px">'+(ls.length?ls.map(function(l){return leaveLi(l,true)}).join(''):'<div class="hint">No leave recorded.</div>')+'</div><h4 style="margin-top:0">Details</h4>';
  }
  h+='<label>Name<input id="r-name" value="'+esc(r.name)+'" placeholder="Dr. …" autocomplete="off"></label>'+
    '<label>Level<select id="r-level">'+LEVELS.map(function(l){return '<option'+(l===r.level?' selected':'')+'>'+l+'</option>'}).join('')+'</select></label>'+
    '<div class="row2"><label>Assignment from<input type="date" id="r-start" value="'+r.start+'"></label><label>To<input type="date" id="r-end" value="'+r.end+'"></label></div>'+
    '<div class="chips">Length: '+[1,2,3,4,6].map(function(n){return '<button data-act="rdur" data-n="'+n+'">'+n+' mo</button>'}).join('')+'</div>'+
    '<div id="r-err" class="info err" style="display:none"></div>'+
    '<div class="actions">'+(id?'<button class="btn danger" data-act="delRes">Delete</button><span class="sp"></span>':'')+'<button class="btn" data-act="close">'+(id?'Close':'Cancel')+'</button><button class="btn primary" data-act="saveRes">Save</button></div>';
  openSheet(h);
  if(!id)setTimeout(function(){var n=$('r-name');if(n)n.focus()},50);
}

function firmSheet(){
  F={kind:'firm'};
  openSheet('<h3>Firm name</h3><label>Name<input id="firm-name" value="'+esc(S.firm)+'"></label><div class="actions"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="saveFirm">Save</button></div>');
}
function backupSheet(){
  F={kind:'backup'};
  openSheet('<h3>Backup / restore</h3><label>Your data (copy and keep it somewhere safe)<textarea id="bk-out" readonly>'+esc(JSON.stringify(S))+'</textarea></label><div class="actions" style="margin:-4px 0 16px"><button class="btn sm" data-act="copyBk">Copy data</button></div>'+
  '<label>Restore — paste backup here (replaces everything)<textarea id="bk-in" placeholder=\'{"firm":…}\'></textarea></label><div id="bk-err" class="info err" style="display:none"></div><div class="actions"><button class="btn" data-act="close">Close</button><button class="btn danger" data-act="restore">Restore</button></div>');
}

function copy(text,okMsg){
  try{navigator.clipboard.writeText(text).then(function(){toast(okMsg)},function(){fallback()})}catch(e){fallback()}
  function fallback(){openSheet('<h3>Copy this</h3><label><textarea id="cp" style="height:220px">'+esc(text)+'</textarea></label><div class="actions"><button class="btn primary" data-act="close">Done</button></div>');setTimeout(function(){var t=$('cp');if(t){t.focus();t.select()}},50)}
}
function summaryText(){
  var rows=sumRows(),per=ui.sum==='month'?MONTHS[ui.m]+' '+ui.y:'Whole assignment';
  var t='*'+S.firm+' — Leave summary ('+per+')*\n';
  if(!rows.length)return t+'No residents.';
  rows.forEach(function(x){var s=x.s,p=[];TK.forEach(function(k){if(s[k])p.push(TYPES[k].name+' '+s[k])});
    t+='\n• '+x.r.name+(x.r.level?' ('+x.r.level+')':'')+': '+(p.length?p.join(', ')+' — total '+s.T+'d':'no leave')+' / '+s.days+'d in firm'});
  return t;
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;var a=t.dataset.act;
  if(a==='tab'){ui.v=t.dataset.v;render();window.scrollTo(0,0)}
  else if(a==='prev'||a==='next'){ui.m+=a==='prev'?-1:1;if(ui.m<0){ui.m=11;ui.y--}if(ui.m>11){ui.m=0;ui.y++}render()}
  else if(a==='thisMonth'){var d=new Date();ui.y=d.getFullYear();ui.m=d.getMonth();render()}
  else if(a==='cv'){ui.cv=t.dataset.v;render()}
  else if(a==='day')daySheet(t.dataset.d);
  else if(a==='sumMode'){ui.sum=t.dataset.v;render()}
  else if(a==='addLeave')leaveSheet({});
  else if(a==='cell')leaveSheet({rid:t.dataset.r,date:t.dataset.d});
  else if(a==='editLeave')leaveSheet({id:t.dataset.id});
  else if(a==='leaveFor')leaveSheet({rid:t.dataset.id});
  else if(a==='addRes')resSheet();
  else if(a==='openRes')resSheet(t.dataset.id);
  else if(a==='firm')firmSheet();
  else if(a==='backup')backupSheet();
  else if(a==='close')closeSheet();
  else if(a==='copySum')copy(summaryText(),'Summary copied');
  else if(a==='copyBk')copy(JSON.stringify(S),'Data copied');
  else if(a==='ftype'){F.L.type=t.dataset.t;sheet.querySelectorAll('[data-act=ftype]').forEach(function(b){var on=b.dataset.t===F.L.type;b.classList.toggle('on',on);b.style.background=on?TYPES[b.dataset.t].color:''});updInfo()}
  else if(a==='fdur'){var s=$('f-start').value||today();$('f-start').value=s;$('f-end').value=addDays(s,+t.dataset.n-1);updInfo()}
  else if(a==='rdur'){var rs=$('r-start').value||today();$('r-start').value=rs;$('r-end').value=addMonths(rs,+t.dataset.n)}
  else if(a==='saveLeave'){
    var L=readLeave(),c=checkLeave(L);if(c.err){updInfo();return}
    if(L.id){var o=lv(L.id);Object.assign(o,L)}else{L.id=uid();S.leaves.push(L)}
    closeSheet();save();toast(TYPES[L.type].name+' leave saved');
  }
  else if(a==='delLeave'){
    if(!F.delL){F.delL=true;t.textContent='Tap again to delete';return}
    S.leaves=S.leaves.filter(function(x){return x.id!==F.L.id});closeSheet();save();toast('Leave deleted');
  }
  else if(a==='saveRes'){
    var R=F.R,err=$('r-err');R.name=$('r-name').value.trim();R.level=$('r-level').value;R.start=$('r-start').value;R.end=$('r-end').value;
    var m=!R.name?'Enter a name.':(!R.start||!R.end)?'Choose assignment dates.':R.end<R.start?'End date is before start date.':'';
    if(m){err.style.display='block';err.textContent=m;return}
    if(R.id)Object.assign(res(R.id),R);else{R.id=uid();S.residents.push(R)}
    closeSheet();save();toast('Resident saved');
  }
  else if(a==='delRes'){
    if(!F.del){F.del=true;t.textContent='Tap again — deletes their leaves too';return}
    var id=F.R.id;S.residents=S.residents.filter(function(x){return x.id!==id});S.leaves=S.leaves.filter(function(x){return x.rid!==id});closeSheet();save();toast('Resident deleted');
  }
  else if(a==='saveFirm'){var n=$('firm-name').value.trim();if(n){S.firm=n;closeSheet();save()}}
  else if(a==='restore'){
    var be=$('bk-err');
    try{var d=JSON.parse($('bk-in').value);if(!d||!Array.isArray(d.residents)||!Array.isArray(d.leaves))throw 0;S=norm(d);closeSheet();save();toast('Data restored')}
    catch(x){be.style.display='block';be.textContent='That doesn’t look like a valid backup.'}
  }
});
document.addEventListener('input',function(e){
  if(!F)return;var id=e.target.id;
  if(F.kind==='leave'&&(id==='f-start'||id==='f-end'||id==='f-rid')){
    if(id==='f-start'){var s=$('f-start').value,en=$('f-end');if(s&&(!en.value||en.value<s))en.value=s}
    updInfo();
  }
});
document.addEventListener('change',function(e){if(e.target.id==='rf'){ui.rf=e.target.value;render();return}if(F&&F.kind==='leave'&&e.target.id==='f-rid')updInfo()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&sheetOpen)closeSheet()});

render();
})();
</script></body></html>
